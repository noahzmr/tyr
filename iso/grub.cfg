# Tyr live @VERSION@ (@ARCH@)
#
# toram: the system is copied into memory, so BMC virtual media may
# disconnect during a long run. consoleblank=0: the verdict stays visible.
set default=0
set timeout=15
set timeout_style=menu

set common="boot=live toram nopersistence consoleblank=0 console=ttyS0,115200n8 console=tty0 quiet loglevel=3"

menuentry "Tyr burn-in (~4 h): test this machine and judge it" {
	linux /live/vmlinuz $common tyr.profile=burnin
	initrd /live/initrd.img
}
menuentry "Tyr quick (~30 min): finds dead parts, not marginal ones" {
	linux /live/vmlinuz $common tyr.profile=quick
	initrd /live/initrd.img
}
menuentry "Tyr extended (~24 h): burn-in before production" {
	linux /live/vmlinuz $common tyr.profile=extended
	initrd /live/initrd.img
}
menuentry "Tyr interactive: TUI and shell, no automatic test" {
	linux /live/vmlinuz $common tyr.profile=none
	initrd /live/initrd.img
}
if [ "$grub_cpu" = "x86_64" -o "$grub_cpu" = "i386" ]; then
	if [ "$grub_platform" = "efi" ]; then
		menuentry "memtest86+ (pre-OS memory test; needs Secure Boot off)" {
			chainloader /boot/memtest86+x64.efi
		}
	else
		menuentry "memtest86+ (pre-OS memory test)" {
			linux16 /boot/memtest86+x64.bin
		}
	fi
fi
if [ "$grub_platform" = "efi" ]; then
	menuentry "UEFI firmware settings" {
		fwsetup
	}
fi
menuentry "Reboot" {
	reboot
}
